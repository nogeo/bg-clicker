name: Build Windows & macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build BgClicker.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BgClicker-windows
          path: BgClicker.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build BgClicker.app
        run: |
          chmod +x macos/build.sh
          ./macos/build.sh
          cd macos
          zip -r BgClicker-macOS.zip BgClicker.app
      - uses: actions/upload-artifact@v4
        with:
          name: BgClicker-macos
          path: macos/BgClicker-macOS.zip
