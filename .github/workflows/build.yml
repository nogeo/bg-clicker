name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build BgClicker.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BgClicker-windows
          path: BgClicker.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build BgClicker.app
        run: |
          chmod +x macos/build.sh
          ./macos/build.sh
          cd macos
          zip -r BgClicker-macOS.zip BgClicker.app
      - uses: actions/upload-artifact@v4
        with:
          name: BgClicker-macos
          path: macos/BgClicker-macOS.zip

  release:
    needs: [ build-windows, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/BgClicker.exe dist/BgClicker-macOS.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BgClicker ${TAG}" \
            --generate-notes
